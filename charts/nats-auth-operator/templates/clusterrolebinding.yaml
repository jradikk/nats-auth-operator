apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" .Values.namespaced }}
metadata:
  name: {{ include "nats-auth-operator.fullname" . }}-manager-rolebinding
  {{- if .Values.namespaced }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "nats-auth-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" .Values.namespaced }}
  name: {{ include "nats-auth-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "nats-auth-operator.controllerManagerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nats-auth-operator.clusterScopedName" (list . "proxy-rolebinding") }}
  labels:
    {{- include "nats-auth-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nats-auth-operator.clusterScopedName" (list . "proxy-role") }}
subjects:
- kind: ServiceAccount
  name: {{ include "nats-auth-operator.controllerManagerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
